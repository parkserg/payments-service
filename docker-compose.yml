x-app-env: &app-env
  API_KEY: ${API_KEY:-dev-secret-key}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://payments:payments@postgres:5432/payments
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  GATEWAY_MIN_DELAY: ${GATEWAY_MIN_DELAY:-2}
  GATEWAY_MAX_DELAY: ${GATEWAY_MAX_DELAY:-5}
  GATEWAY_SUCCESS_RATE: ${GATEWAY_SUCCESS_RATE:-0.9}
  RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
  RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-2}

x-app: &app
  build: .
  image: payments-service:latest
  environment: *app-env
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrations:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  outbox-relay:
    <<: *app
    command: ["python", "-m", "app.workers.outbox_relay"]
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  consumer:
    <<: *app
    command: ["python", "-m", "app.workers.consumer"]
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  webhook-mock:
    <<: *app
    command: ["uvicorn", "tools.webhook_mock.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment: {}
    ports:
      - "${WEBHOOK_MOCK_PORT:-8090}:8080"

volumes:
  postgres-data:
  rabbitmq-data:
